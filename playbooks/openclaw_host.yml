---
- name: Harden Ubuntu 26.04 OpenClaw Host
  hosts: openclaw_nodes
  become: true
  vars:
    openclaw_user: openclaw-svc
    openclaw_dir: /opt/openclaw

  tasks:
    - name: Ensure UFW and Node/Python runtime dependencies are installed
      apt:
        name:
          - ufw
          - curl
          - git
          - python3
          - python3-venv
        state: present
        update_cache: yes

    - name: Create non-privileged OpenClaw service account (no sudo, no shell login)
      user:
        name: "{{ openclaw_user }}"
        system: yes
        create_home: no
        shell: /usr/sbin/nologin

    - name: Create scoped OpenClaw directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0750"
      loop:
        - "{{ openclaw_dir }}"
        - "{{ openclaw_dir }}/workspace"

    - name: Deploy OpenClaw safe_ingest.py air-lock wrapper
      copy:
        src: "../files/openclaw/safe_ingest.py"
        dest: "{{ openclaw_dir }}/workspace/safe_ingest.py"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0750"

    - name: Write scoped OpenClaw environment file (chmod 600)
      copy:
        dest: "{{ openclaw_dir }}/.env"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0600"
        content: |
          OPENAI_BASE_URL=http://{{ server1_ip }}:4000/v1
          OPENAI_API_KEY={{ openclaw_litellm_key }}
          SECURE_RAG_URL=http://{{ server2_ip }}:8090
          OPENCLAW_WORKSPACE={{ openclaw_dir }}/workspace
          OPENCLAW_SANDBOX_MODE=strict

    - name: Deploy hardened systemd unit for OpenClaw
      copy:
        dest: /etc/systemd/system/openclaw.service
        mode: "0644"
        content: |
          [Unit]
          Description=OpenClaw Sandboxed Autonomous Agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ openclaw_user }}
          Group={{ openclaw_user }}
          WorkingDirectory={{ openclaw_dir }}/workspace
          EnvironmentFile={{ openclaw_dir }}/.env
          ExecStart=/usr/bin/env openclaw gateway --port 18789 --bind 127.0.0.1
          Restart=on-failure
          RestartSec=5

          # Kernel-Level Privilege & Filesystem Sandboxing
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          ReadWritePaths={{ openclaw_dir }}/workspace
          PrivateTmp=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          RestrictSUIDSGID=yes
          MemoryMax=4G
          CPUQuota=200%

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    # --- HOST FIREWALL (UFW) EGRESS & INGRESS LOCKDOWN ---
    - name: Set UFW default deny incoming
      ufw:
        direction: incoming
        policy: deny

    - name: Allow SSH management from Windows 11 workstation only
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ win11_ip }}"

    - name: Allow OpenClaw outbound to Server 1 LiteLLM Gateway (Port 4000)
      ufw:
        rule: allow
        direction: out
        port: "4000"
        proto: tcp
        dest: "{{ server1_ip }}"

    - name: Allow OpenClaw outbound to Server 2 Secure RAG API (Port 8090)
      ufw:
        rule: allow
        direction: out
        port: "8090"
        proto: tcp
        dest: "{{ server2_ip }}"

    - name: Block all other outbound traffic from OpenClaw host to internal LAN
      ufw:
        rule: deny
        direction: out
        dest: "{{ lan_subnet }}"

    - name: Allow outbound DNS and HTTP/HTTPS for approved web scraping
      ufw:
        rule: allow
        direction: out
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "53", proto: "any" }
        - { port: "80", proto: "tcp" }
        - { port: "443", proto: "tcp" }

    - name: Enable UFW on OpenClaw host
      ufw:
        state: enabled
