---
- name: Bootstrap inventory.ini if missing
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    inv_path: "{{ playbook_dir }}/../inventory.ini"
  tasks:
    - name: Check if inventory.ini already exists
      ansible.builtin.stat:
        path: "{{ inv_path }}"
      register: inv_stat

    - name: Prompt for Server 1 IP (AI Security Gateway)
      ansible.builtin.pause:
        prompt: "Enter Server 1 IP address (Dell Latitude 7480 - AI Security Gateway)"
      register: s1_ip
      when: not inv_stat.stat.exists

    - name: Prompt for Server 2 IP (Firewalled RAG & Audio Workloads)
      ansible.builtin.pause:
        prompt: "Enter Server 2 IP address (Lenovo Ideapad 130-15IKB - RAG Workloads)"
      register: s2_ip
      when: not inv_stat.stat.exists

    - name: Prompt for SSH username on both servers
      ansible.builtin.pause:
        prompt: "Enter SSH username for both Ubuntu servers (e.g., ubuntu)"
      register: ssh_user
      when: not inv_stat.stat.exists

    - name: Generate inventory.ini from prompted inputs
      ansible.builtin.copy:
        dest: "{{ inv_path }}"
        mode: "0640"
        content: |
          [security_gateway]
          server1 ansible_host={{ s1_ip.user_input | trim }} ansible_user={{ ssh_user.user_input | trim }} ansible_python_interpreter=/usr/bin/python3

          [rag_workloads]
          server2 ansible_host={{ s2_ip.user_input | trim }} ansible_user={{ ssh_user.user_input | trim }} ansible_python_interpreter=/usr/bin/python3

          [ai_lab:children]
          security_gateway
          rag_workloads
      when: not inv_stat.stat.exists

    - name: Load newly generated inventory.ini into active play
      ansible.builtin.add_host:
        name: server1
        groups:
          - security_gateway
          - ai_lab
        ansible_host: "{{ s1_ip.user_input | trim }}"
        ansible_user: "{{ ssh_user.user_input | trim }}"
        ansible_python_interpreter: /usr/bin/python3
      when: not inv_stat.stat.exists

    - name: Load newly generated server2 into active play
      ansible.builtin.add_host:
        name: server2
        groups:
          - rag_workloads
          - ai_lab
        ansible_host: "{{ s2_ip.user_input | trim }}"
        ansible_user: "{{ ssh_user.user_input | trim }}"
        ansible_python_interpreter: /usr/bin/python3
      when: not inv_stat.stat.exists

- name: Deploy Server 1 AI Security Gateway & OpenClaw
  import_playbook: server1_gateway.yml

- name: Deploy Server 2 Firewalled RAG & Audio Workloads
  import_playbook: server2_rag.yml
