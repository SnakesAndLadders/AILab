---
- name: Configure Server 2 (Workloads & Firewalled RAG)
  hosts: rag_workloads
  become: false
  vars:
    stack_dir: /opt/ai-app-and-rag-workloads

  tasks:
    - name: Create stack and persistent data directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ stack_dir }}"
        - "{{ stack_dir }}/rag-service"
        - "{{ stack_dir }}/qdrant_storage"
        - "{{ stack_dir }}/notebook_data"
        - "{{ stack_dir }}/speakr_data"

    - name: Copy Docker Compose file
      copy:
        src: "../files/server2/docker-compose.yml"
        dest: "{{ stack_dir }}/docker-compose.yml"
        mode: "0640"

    - name: Copy Secure RAG API service files
      copy:
        src: "../files/server2/rag-service/{{ item }}"
        dest: "{{ stack_dir }}/rag-service/{{ item }}"
        mode: "0640"
      loop:
        - Dockerfile
        - main.py

    - name: Write .env file for Server 2
      copy:
        dest: "{{ stack_dir }}/.env"
        mode: "0600"
        content: |
          SERVER2_LITELLM_KEY={{ server2_litellm_key }}

    - name: Configure UFW default deny incoming
      ufw:
        direction: incoming
        policy: deny

    - name: Allow SSH from LAN subnet
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ lan_subnet }}"

    - name: Allow authorized clients to reach Secure RAG API (Port 8090)
      ufw:
        rule: allow
        port: "8090"
        proto: tcp
        src: "{{ item }}"
      loop:
        - "{{ win11_ip }}"
        - "{{ server1_ip }}"

    - name: Allow Windows 11 workstation to reach Open Notebook (8502) and Speakr (8899)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        src: "{{ win11_ip }}"
      loop:
        - "8502"
        - "8899"

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Build and start Server 2 RAG and Workload stack
      command: docker compose up -d --build
      args:
        chdir: "{{ stack_dir }}"
