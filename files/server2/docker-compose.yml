name: ai-app-and-rag-workloads

networks:
  lan_net:
    driver: bridge
  rag_internal:
    driver: bridge
    internal: true

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vectordb
    restart: unless-stopped
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - rag_internal
    deploy:
      resources:
        limits:
          memory: 2G

  secure-rag-api:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: secure-rag-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - LITELLM_BASE_URL=http://192.168.1.10:4000
      - LITELLM_API_KEY=${SERVER2_LITELLM_KEY}
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=lab_knowledge_base
    networks:
      - lan_net
      - rag_internal
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 1G
          
    # Lightweight SurrealDB Backend for Open Notebook
  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: open-notebook-db
    restart: unless-stopped
    user: root
    command: start --log warn --user root --pass root rocksdb:/mydata/mydatabase.db
    volumes:
      - ./notebook_surreal:/mydata
    networks:
      - lan_net
    deploy:
      resources:
        limits:
          memory: 512M


  open-notebook:
    image: lfnovo/open_notebook:latest
    container_name: open-notebook
    restart: unless-stopped
    ports:
      - "8502:8502"
    environment:
      - OPENAI_API_KEY=${SERVER2_LITELLM_KEY}
      - OPENAI_BASE_URL=http://192.168.1.10:4000
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    volumes:
      - ./notebook_data:/app/data
      - ./notebook_data:/mydata
    depends_on:
      - surrealdb
    networks:
      - lan_net
    deploy:
      resources:
        limits:
          memory: 2G

  speakr:
    image: learnedmachine/speakr:lite
    container_name: speakr
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - TRANSCRIPTION_CONNECTOR=openai_whisper
      - TRANSCRIPTION_API_KEY=${SERVER2_LITELLM_KEY}
      - TRANSCRIPTION_BASE_URL=http://192.168.1.10:4000
      - TRANSCRIPTION_MODEL=safe-whisper-default
      - SUMMARIZATION_API_KEY=${SERVER2_LITELLM_KEY}
      - SUMMARIZATION_BASE_URL=http://192.168.1.10:4000
      - SUMMARIZATION_MODEL=safe-chat-default
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=changeme
    volumes:
      - ./speakr_data/uploads:/data/uploads
      - ./speakr_data/instance:/data/instance
    networks:
      - lan_net
    deploy:
      resources:
        limits:
          memory: 3G