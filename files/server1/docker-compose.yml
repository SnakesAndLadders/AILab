name: ai-security-gateway

networks:
  lan_ingress:
    driver: bridge
  secure_egress:
    driver: bridge
    internal: true
  openclaw_net:
    driver: bridge

services:

  # Lightweight PostgreSQL Backend for LiteLLM Virtual Keys & Audit Logs (Internal Only)
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
    volumes:
      - ./litellm_pgdata:/var/lib/postgresql/data
    networks:
      - secure_egress
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
  
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      - PRESIDIO_ANALYZER_API_BASE=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_API_BASE=http://presidio-anonymizer:3000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./litellm_data:/app/data
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    networks:
      - lan_ingress
      - secure_egress
      - openclaw_net
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer
      - guardrails-server
    deploy:
      resources:
        limits:
          memory: 2.5G

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    restart: unless-stopped
    networks:
      - secure_egress
    deploy:
      resources:
        limits:
          memory: 2.5G

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    restart: unless-stopped
    networks:
      - secure_egress
    deploy:
      resources:
        limits:
          memory: 1G

  guardrails-server:
    build:
      context: ./guardrails
      dockerfile: Dockerfile
    container_name: guardrails-server
    restart: unless-stopped
    environment:
      - GUARDRAILS_TOKEN=${GUARDRAILS_TOKEN}
    networks:
      - secure_egress
    deploy:
      resources:
        limits:
          memory: 3.5G

  # Hardened Autonomous Agent Container (Read-only rootfs + explicit writable state/cache mounts)
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-agent
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M,uid=1000,gid=1000
      - /home/node/.cache:size=128M,uid=1000,gid=1000
      - /home/node/.npm:size=128M,uid=1000,gid=1000
    ports:
      - "18789:18789"
    environment:
      - HOME=/home/node
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${OPENCLAW_LITELLM_KEY}
      - SECURE_RAG_URL=http://192.168.1.11:8090
      - OPENCLAW_SANDBOX_MODE=strict
    volumes:
      - ./openclaw_workspace:/workspace
      - ./openclaw_data:/home/node/.openclaw
    networks:
      - openclaw_net
    depends_on:
      - litellm
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
