recognizers:
  - name: "Canadian Postal Code Recognizer"
    supported_entity: "CA_POSTAL_CODE"
    supported_language: "en"
    patterns:
      - name: "ca_postal_code"
        regex: "\\b[ABCEGHJ-NPRSTVXY]\\d[ABCEGHJ-NPRSTV-Z][ -]?\\d[ABCEGHJ-NPRSTV-Z]\\d\\b"
        score: 0.85

  - name: "Alberta Personal Health Number Recognizer"
    supported_entity: "AB_PHN"
    supported_language: "en"
    context: ["phn", "health", "alberta health", "uli", "health card", "ahcip"]
    patterns:
      - name: "ab_phn_pattern"
        regex: "\\b\\d{5}[- ]?\\d{4}\\b"
        score: 0.5